name: Market Bot Worker

on:
  schedule:
    - cron: '*/15 * * * *' # Executa a cada 15 minutos
  workflow_dispatch:

jobs:
  run-market-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Garantir pasta de logs
        run: mkdir -p logs

      - name: Executar Bot de Mercado
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/bot_mercado.py | tee -a logs/system.log

      - name: Commitar Logs do Mercado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(market): atualização automática de logs [skip ci]"
          branch: main