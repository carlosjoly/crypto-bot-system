name: Discovery Bot Worker

on:
  schedule:
    - cron: '0 */1 * * *' # Executa a cada 1 horas 
  workflow_dispatch:

jobs:
  run-discovery-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Garantir pasta de logs
        run: mkdir -p logs

      - name: Executar Bot de Descoberta
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/bot_descoberta.py | tee logs/system.log

      - name: Upload de Logs como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: discovery-log-${{ github.run_id }}
          path: logs/system.log
          retention-days: 7
